name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Build universal app
        run: ./scripts/build_app.sh --universal

      - name: Package DMG
        run: ./scripts/make_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioDiverger
          path: build/*.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg \
            --title "AudioDiverger $GITHUB_REF_NAME" \
            --notes "Download the .dmg and drag AudioDiverger to Applications. On first launch: right-click → Open (the app is not notarized by Apple)."
